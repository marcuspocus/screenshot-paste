name: Release to npmjs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          test "$TAG" = "v$VERSION" || {
            echo "Tag $TAG does not match package version $VERSION" >&2
            exit 1
          }

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish to npmjs with provenance
        run: npm publish --registry=https://registry.npmjs.org/ --access public --provenance
